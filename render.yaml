# Deploy only after following FREE_DEPLOYMENT.md. Secrets are entered in Render, never committed.
services:
  - type: web
    name: digital-krushi-officer
    runtime: docker
    plan: free
    healthCheckPath: /health/live
    autoDeployTrigger: 'off'
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: Hosting__Platform
        value: Render
      # Only for Free public services. Before a paid/private-network upgrade, review proxy trust again.
      - key: Hosting__RenderFreePublicEdge
        value: true
      - key: Database__Provider
        value: MySql
      - key: Database__ServerVersion
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Storage__Provider
        value: Supabase
      - key: Storage__Supabase__Url
        sync: false
      - key: Storage__Supabase__Bucket
        value: dko-media
      - key: Storage__Supabase__ServiceRoleKey
        sync: false
      - key: Email__Provider
        value: Brevo
      - key: Email__FromEmail
        sync: false
      - key: Email__Brevo__ApiKey
        sync: false
      - key: DataProtection__PersistToDatabase
        value: true
      - key: DataProtection__CertificateBase64
        sync: false
      - key: DataProtection__CertificatePassword
        sync: false
      - key: AISettings__GeminiApiKey
        sync: false
      - key: AISettings__OpenWeatherApiKey
        sync: false
      - key: MarketPrices__ApiKey
        sync: false
